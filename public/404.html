<!doctype html>
<html lang="en-AE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#fbfaf5" />
    <title>Page not found | Logos International</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #12110f;
        --muted: #6d6960;
        --paper: #fbfaf5;
        --line: #ded8ca;
        --accent: #7c2b1b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(18, 17, 15, 0.035) 1px, transparent 1px),
          var(--paper);
        background-size: 72px 72px;
        color: var(--ink);
        font-family: "Manrope", "Avenir Next", "Segoe UI", sans-serif;
      }

      main {
        width: min(calc(100% - 40px), 760px);
        padding: 56px 0 64px;
      }

      img { width: min(260px, 72vw); height: auto; }

      .rule { height: 1px; margin: 36px 0; background: var(--line); }

      .code {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      h1 {
        max-width: 660px;
        margin: 0;
        font-size: clamp(42px, 8vw, 78px);
        line-height: 0.98;
        letter-spacing: -0.055em;
      }

      p {
        max-width: 570px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.65;
      }

      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        color: var(--ink);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, color 160ms ease, transform 160ms ease;
      }

      a:first-child { background: var(--ink); color: #fff; }
      a:hover { transform: translateY(-1px); }
      a:active { transform: translateY(0); }
      a:focus-visible { outline: 3px solid #255edb; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-horizontal.svg" alt="Logos International" />
      <div class="rule"></div>
      <p class="code">404 / PAGE NOT FOUND</p>
      <h1>This page is not in the supply catalog.</h1>
      <p>The address may have changed. Return to the homepage or continue directly to the product catalog.</p>
      <nav aria-label="Page not found navigation">
        <a href="/">Return home</a>
        <a href="/catalog">Browse catalog</a>
      </nav>
    </main>
  </body>
</html>
